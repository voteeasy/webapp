# Test ONLY
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=test
spring.liquibase.enabled=true
spring.datasource.url=${VE_DB_URL}
spring.datasource.username=${VE_DB_USERNAME}
spring.datasource.password=${VE_DB_PASSWORD}
#spring.liquibase.url=${DB_URL}
# taken from datasource implicitly
#spring.liquibase.user=sa
#spring.liquibase.password=
spring.liquibase.default-schema=public
spring.jpa.properties.hibernate.default_schema=public
logging.level.liquibase=INFO
spring.jpa.hibernate.ddl-auto=create-drop
spring.test.database.replace=none
# Show SQL in order to generate Liquibase changesets
#spring.jpa.show-sql=true
# https://stackoverflow.com/questions/47141176/spring-boot-psqlexception-fatal-sorry-too-many-clients-already-when-running#54350770
# slows down tests by a factor of 10: spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=600000

spring.datasource.hikari.leakDetectionThreshold=2000
spring.datasource.hikari.maximum-pool-size=2
