<!doctype html>
<html th:lang="${#locale.language}" class="notranslate" translate="no"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <title th:text="#{menu.changePassword}"></title>
    <link rel="stylesheet" th:href="@{/css/show-password-toggle.min.css}">
    <style>
        button#toggle-passwordAgain {
            position: absolute;
            top: 3px;
            right: 4px;
            z-index: 9;
            width: 28px;
            height: 30px;
            background: 0;
            border: 0;
        }

        button#toggle-passwordAgain:active,
        button#toggle-passwordAgain:focus,
        button#toggle-passwordAgain:hover {
            cursor: pointer;
        }

        button#toggle-passwordAgain:focus {
            outline: none !important;
        }
    </style>
    <link th:replace="~{fragments/headCss :: link}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>
<div class="container">
    <h1 th:text="#{title.changeuser}"></h1>
    <ul>
        <li><a th:replace="~{fragments/historyBack}"></a></li>
    </ul>

    <div class="my-5">
        <h3 th:text="#{menu.changePassword}"></h3>
        <div class="card">
            <div class="card-body">
                <div class="col-md-10">
                    <form action="#" method="post" th:action="@{/settings/changePassword}" th:object="${account}">
                        <input name="userId" th:value="${account.userId}" type="hidden"/>
                        <input name="userName" th:value="${account.userName}" type="hidden"/>
                        <input name="fullName" th:value="${account.fullName}" type="hidden"/>

                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="name" th:text="#{login.form.username}"></label>:
                                <span id="name" th:placeholder="#{login.form.username}"
                                      th:text="*{userName}"></span>
                            </div>

                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="fullName" th:text="#{changeuser.fullname}"></label>:
                                <span id="fullName" th:placeholder="#{changeuser.fullname}"
                                      th:text="*{fullName}"></span>
                            </div>

                            <div th:replace="~{fragments/showRoles :: showRoles}"></div>

                            <div class="form-group col-md-8" th:text="#{changepassword.pwrules}"></div>
                            <div class="form-group col-md-8" th:text="#{changepassword.explanation}"></div>

                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="password" th:text="#{changeuser.password}"></label>
                                <div class="input-group">
                                    <input
                                            autocapitalize="off" autocorrect="off" class="form-control" id="password"
                                            spellcheck="false" th:field="*{password}"
                                            th:placeholder="#{changepassword.password.placeholder}"
                                            type="password">
                                    <button aria-label="Show password as plain text. Warning: this will display your password on the screen."
                                            class="d-none" id="toggle-password"
                                            type="button"></button>
                                </div>
                                <span
                                        class="text-danger" th:errors="*{password}"
                                        th:if="${#fields.hasErrors('password')}"></span>
                                <span
                                        class="text-danger" th:errors="*{global}"
                                        th:if="${#fields.hasGlobalErrors()}"></span>
                            </div>
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="passwordAgain"
                                       th:text="#{changeuser.passwordAgain}"></label>
                                <div class="input-group">
                                    <input
                                            autocapitalize="off" autocorrect="off" class="form-control"
                                            id="passwordAgain"
                                            spellcheck="false" th:field="*{passwordAgain}"
                                            th:placeholder="#{changepassword.passwordAgain.placeholder}"
                                            type="password">
                                    <button aria-label="Show password as plain text. Warning: this will display your password on the screen."
                                            class="d-none" id="toggle-passwordAgain"
                                            type="button"></button>
                                </div>
                                <span
                                        class="text-danger" th:errors="*{passwordAgain}"
                                        th:if="${#fields.hasErrors('passwordAgain')}"></span>
                                <span
                                        class="text-danger" th:errors="*{global}"
                                        th:if="${#fields.hasGlobalErrors()}"></span>

                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 pt-2">
                                <input class="btn btn-primary ml-2" disabled="disabled"
                                       th:value="#{changepassword.submit}" type="submit">
                                <input class="btn btn-danger ml-2" th:value="#{menu.resetForm}" type="reset"/>
                            </div>

                            <div class="form-group col-md-8"></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:replace="~{fragments/loadJs :: script}"></script>
<script>
    $(document).ready(function () {
        $('input').blur(function () {
            let samePasswords = false;

            let pwField = $('#password').val();
            let pwAgainField = $('#passwordAgain').val();

            if (pwField === pwAgainField) {
                samePasswords = true;
            }

            if (samePasswords) {
                $('.btn[type="submit"]').removeAttr('disabled');
            } else {
                $('.btn[type="submit"]').attr('disabled', 'disabled');
            }
        });
    });
</script>
<script th:src="@{/js/show-password-toggle.min.js}"></script>
<script>
    // 20210228: https://github.com/coliff/bootstrap-show-password-toggle/issues/12
    // manually copied over script adapted for 2nd button field from
    // https://github.com/coliff/bootstrap-show-password-toggle/blob/master/js/show-password-toggle.js
    // adapted field ids
    document.getElementById("passwordAgain").classList.add("input-password");
    document.getElementById("toggle-passwordAgain").classList.remove("d-none");
    const passwordAgainInput = document.getElementById("passwordAgain");
    const togglePasswordAgainButton = document.getElementById("toggle-passwordAgain");
    togglePasswordAgainButton.addEventListener("click", togglePasswordAgain);

    function togglePasswordAgain() {
        if (passwordAgainInput.type === "password") {
            passwordAgainInput.type = "text";
            togglePasswordAgainButton.setAttribute("aria-label", "Hide password.");
        } else {
            passwordAgainInput.type = "password";
            togglePasswordAgainButton.setAttribute(
                "aria-label",
                "Show password as plain text. " +
                "Warning: this will display your password on the screen."
            );
        }
    }
</script>
</body>
</html>
