<!DOCTYPE html>
<html class="notranslate" th:lang="${#locale.language}" translate="no"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="https://www.thymeleaf.org">
<body>
<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark" th:fragment="nav">
    <div class="container-fluid">
        <!--/* span class="navbar-brand mb-0 h1" th:text="#{title.main}"></span */-->
        <button aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation"
                class="navbar-toggler"
                data-target="#navbarCollapse" data-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <a class="navbar-brand" target="_blank" th:href="#{footer.homepage}">
                <img alt="VoteEasy logo" loading="lazy" th:src="@{/img/logo.png}">
            </a>
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"
                    th:classappend="${(servletPath == '/' || servletPath == '') ? 'active' : ''}">
                    <a aria-current="page" class="nav-link" th:href="@{/}"><i class="fas fa-home ml-2"></i> <span
                            th:text="#{menu.home}"></span></a>
                </li>
                <li class="nav-item"
                    th:classappend="${servletPath.contains('/gatherings/') || servletPath.contains('/votings/') || servletPath.contains('/results/') ? 'active' : ''}">
                    <a
                            class="nav-link" th:href="@{/gatherings/}"><i class="fas fa-swimmer ml-2"></i> <span
                            th:text="#{menu.gatherings}"></span></a>
                </li>
                <li class="nav-item" th:classappend="${servletPath.contains('/votes/') ? 'active' : ''}">
                    <a
                            class="nav-link" th:href="@{/votes/}"><i class="fas fa-envelope ml-2"></i> <span
                            th:text="#{menu.votes}"></span></a>
                </li>

                <li class="nav-item dropdown" sec:authorize="isAuthenticated()"
                    th:classappend="${servletPath.contains('/participation/') || servletPath.contains('/settings/') || servletPath.contains('/tsettings/')? 'active' : ''}">
                    <a aria-expanded="false" class="nav-link dropdown-toggle" data-toggle="dropdown" href="#"
                       id="navbarDropdown"
                       role="button"><i class="fas fa-users-cog" th:text="'&nbsp;'+#{menu.settings}"></i>
                    </a>
                    <ul aria-labelledby="navbarDropdown" class="dropdown-menu">
                        <li class="dropdown-item-text">
                            <span th:text="#{login.form.username}"></span>: <span
                                th:text="${#authentication.name}"></span>
                        </li>
                        <li class="dropdown-item-text">
                            <span th:text="#{login.form.tenant}"></span>:
                            <span style="text-overflow: ellipsis;"
                                  th:if="${#authentication.getPrincipal() != null && #authentication.getPrincipal() instanceof T(de.voteeasy.user.ApplicationUser)}"
                                  th:text="${#authentication.getPrincipal().getTenant().tenantName}"></span>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li class="dropdown-item-text" th:if="${user}">
                            <span th:text="#{changeuser.fullname}"></span>: <span th:text="${user.fullName}"></span>
                        </li>
                        <li class="dropdown-item-text" th:if="${participation}">
                            <i class="fas fa-handshake" style="color:darkgreen"></i> <span
                                th:text="#{menu.participation.yes}"></span>
                        </li>
                        <li class="dropdown-item-text" th:unless="${participation}">
                            <span th:text="#{menu.participation.no}"></span> <i class="fas fa-globe"></i>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" th:href="@{/settings/changeName}"
                               th:text="#{menu.changeUsername}"></a></li>
                        <li><a class="dropdown-item" th:href="@{/settings/changePassword}"
                               th:text="#{menu.changePassword}"></a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" th:href="@{/participation/}" th:text="#{menu.participation}"></a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li class="dropdown-item-text" th:text="#{menu.settings.language}"></li>
                        <li><a class="dropdown-item" th:href="@{''(lang=en)}"><span
                                class="flag-icon flag-icon-gb flag-icon-squared"></span></a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang=de)}"><span
                                class="flag-icon flag-icon-de flag-icon-squared"></span></a></li>
                        <!--li><a class="dropdown-item" th:href="@{''(lang=fr)}"><span
                                class="flag-icon flag-icon-fr flag-icon-squared"></span></a></li-->
                    </ul>
                </li>

                <li class="nav-item dropdown" id="adminmenu" sec:authorize="hasRole('ADMIN')"
                    th:classappend="${servletPath.contains('/admin/') ? 'active' : ''}">
                    <a aria-expanded="false" class="nav-link dropdown-toggle" data-toggle="dropdown" href="#"
                       id="navbarDropdownAdmin"
                       role="button">
                        <i class="fas fa-blind" style="color:firebrick;"
                           th:if="${#authorization.expression('hasRole(''TENANT_ADMIN'')')}"
                           th:text="'&nbsp;'+#{menu.admin}"></i>
                        <i class="fas fa-blind"
                           style="color:#ed9b57;" th:text="'&nbsp;'+#{menu.admin}"
                           th:unless="${#authorization.expression('hasRole(''TENANT_ADMIN'')')}"></i>
                    </a>
                    <ul aria-labelledby="navbarDropdownAdmin" class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/participation/members}"><i
                                class="fas fa-users"></i> <span th:text="#{menu.participants}"></span></a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" th:href="@{/settings/invitation/}"><i
                                class="fas fa-key"></i> <span th:text="#{menu.invitationtoken}"></span></a></li>
                        <li sec:authorize="hasRole('TENANT_ADMIN')"><a class="dropdown-item"
                                                                       th:href="@{/settings/tenant/}"><i
                                aria-hidden="true" class="fa fa-exclamation-circle" style="color:darkred;"></i>
                            <span th:text="#{menu.tenantadmin}"></span></a></li>
                        <li sec:authorize="hasRole('TENANT_ADMIN')"><a class="dropdown-item"
                                                                       th:href="@{/settings/tenant/overdue}"><i
                                aria-hidden="true" class="fa fa-sitemap" style="color:darkred;"></i>
                            <span th:text="#{menu.tenantadmin.overdue}"></span></a></li>
                        <li><a class="dropdown-item"
                               th:href="@{/tsettings/properties/}"><i
                                aria-hidden="true" class="fa fa-list" style="color:darkred;"></i>
                            <span th:text="#{menu.tenantadmin.properties}"></span></a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li sec:authorize="hasRole('TENANT_ADMIN')"><a class="dropdown-item"
                                                                       th:href="@{/admin/cardinality}"><i
                                class="fas fa-table" style="color:darkgray;"></i> <span
                                th:text="#{menu.admin.cardinality}"></span></a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/version}"><i aria-hidden="true"
                                                                                    class="fa fa-ship"
                                                                                    style="color:darkgreen;"></i>
                            <span th:text="#{menu.admin.version}"></span></a></li>
                    </ul>
                </li>
            </ul>

            <div class="my-2 my-lg-0" sec:authorize="isAuthenticated()">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item" th:if="${participation}">
                        <a aria-disabled="true" class="nav-link disabled" href="#" tabindex="-1">
                            <i class="fas fa-handshake" style="color:darkgreen"></i> <span
                                th:text="#{menu.participation.yes}"></span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-info" data-placement="bottom" data-toggle="refresh-tooltip"
                                onClick="window.location.reload();" th:title="#{tooltip.refresh}"><i
                                class="fas fa-sync"></i></button>
                    </li>
                    <li class="nav-item">
                        <form action="#" class="nav-link" method="post" th:action="@{/logout}">
                            <button class="btn btn-sm btn-info btn-block" id="logout" type="submit"><i
                                    class="fas fa-sign-out-alt"></i> <span
                                    th:text="#{menu.logout}"></span></button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
