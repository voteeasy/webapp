<!doctype html>
<html th:lang="${#locale.language}" class="notranslate" translate="no" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="#{title.main}"></title>
    <link th:replace="~{fragments/headCss :: link}">
</head>
<body>
<nav th:replace="~{fragments/navbar.html :: nav}"></nav>

<main class="container" role="main">
    <div th:replace="~{fragments/flashmessage :: flashmessage}"></div>
    <ul>
        <li><a th:replace="~{fragments/historyBack}"></a></li>
    </ul>

    <div class="bg-light p-5 rounded">
        <h2 th:text="#{admin.cardinality.headline}"></h2>

        <div th:if="${cardinalityMap != null}">
            <div class="table-responsive-md">
                <table class="table">
                    <thead>
                    <tr>
                        <th th:text="#{headers.name}"></th>
                        <th th:text="#{headers.count}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cardinality : ${cardinalityMap}">
                        <td th:text="${cardinality.getKey()}"></td>
                        <td th:text="${cardinality.getValue()}"></td>
                    </tr>
                    <tr class="table-secondary">
                        <td th:text="#{headers.total}"></td>
                        <td th:text="${total}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="d-flex align-items-center">
            <div aria-hidden="true" class="spinner-border ml-auto" role="status"></div>
            <div id="piechart_3d" style="width: 900px; height: 500px;"></div>
        </div>

    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</main>
<script th:replace="~{fragments/loadJs :: script}"></script>

<script src="https://www.gstatic.com/charts/loader.js" type="text/javascript"></script>
<script th:inline="javascript" type="text/javascript">
    google.charts.load("current", {packages: ["corechart"]});
    google.charts.setOnLoadCallback(drawChart);
    let i18nTitle = '[[#{menu.admin.cardinality}]]';
    i18nTitle = i18nTitle.slice(1, -1);

    function drawChart() {
        let data = new google.visualization.DataTable();
        data.addColumn('string', 'Table');
        data.addColumn('number', '#rows');
        data.addRows([            /*[# th:each="row : ${cardinalityMapChart}"]*/
            [[${row}]],            /*[/]*/
        ]);
        let options = {
            title: i18nTitle,
            is3D: true,
            pieSliceText: 'value-and-percentage',
        };

        let chart = new google.visualization.PieChart(document.getElementById('piechart_3d'));
        chart.draw(data, options);
    }

    $(document).ready(function () {
        $('.spinner-border').hide();
    });
</script>

</body>
</html>
