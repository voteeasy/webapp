<!doctype html>
<html th:lang="${#locale.language}"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="#{title.main}"></title>
    <link th:replace="~{fragments/headCss :: link}">
</head>
<body>
<nav th:replace="~{fragments/navbar.html :: nav}"></nav>

<div class="container">
    <div th:replace="~{fragments/flashmessage :: flashmessage}"></div>
    <ul>
        <li><a th:replace="~{fragments/historyBack}"></a></li>
    </ul>
    <div class="bg-light p-5 rounded">
        <h2 th:text="#{vote.headline.byUser(${#authentication.name})}"></h2>
        <div class="table-responsive-md">
            <table class="table">
                <thead>
                <tr>
                    <th th:text="#{headers.createdAt}"></th>
                    <th th:text="#{headers.name}"></th>
                    <th th:text="#{headers.selectedOptions}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${votes.isEmpty()}">
                    <td colspan="3" th:text="#{votes.novotes}"></td>
                </tr>
                <tr th:each="vote: ${votes}" th:unles="${votes.isEmpty()}">
                    <td th:text="${#dates.format(vote.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td><span
                            th:text="${vote.proposal?.getGathering()?.getName()}"></span><br/>
                        <span
                                th:text="${vote.proposal.name}"></span>
                    </td>
                    <td>
                        <ol style="list-style-type:none;">
                            <li th:each="option : ${vote.chosenOptions}" th:text="${option.name}"></li>
                        </ol>
                    </td>
                </tr>
                <tr class="table-secondary">
                    <td th:text="#{headers.total}"></td>
                    <td colspan="3" th:text="${votes.size()}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script th:replace="~{fragments/loadJs :: script}"></script>
</body>
</html>
