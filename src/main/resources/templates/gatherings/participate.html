<!doctype html>
<html th:lang="${#locale.language}" class="notranslate" translate="no" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <title th:text="#{menu.joinGathering}"></title>
    <link th:replace="~{fragments/headCss :: link}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>
<div class="container">
    <div th:if="${gathering.isPresent()}">
        <h1 th:text="#{gathering.participate.head(${gathering.get().name})}"></h1>
        <div th:replace="~{fragments/flashmessage :: flashmessage}"></div>
        <ul>
            <li><a th:href="@{/gatherings/}"><i class="fas fa-swimmer ml-2"></i> <span th:text="#{menu.gatherings}"></span></a>
            </li>
            <li><a th:replace="~{fragments/historyBack}"></a></li>
        </ul>
        <h3 th:text="#{gathering.participate.detail}"></h3>
        <div class="table-responsive-md">
            <table class="table">
                <thead>
                <tr>
                    <th th:text="#{headers.commands}"></th>
                    <th th:if="${gathering.get().getVoteProposals() !=null && !gathering.get().getVoteProposals().isEmpty()}"
                        th:text="#{headers.proposals}"></th>
                    <th th:text="#{headers.startedAt}"></th>
                    <th th:text="#{headers.startedBy}"></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>
                        <a class="btn btn-primary" th:href="@{/votings/proposals/{id}(id=${gathering.get().id})}">
                            <i class="fas fa-id-card ml-2"></i> <span th:text="#{menu.voteOptions}"></span></a>

                        <div class="pt-3">
                            <a class="btn btn-success"
                               th:href="@{/votings/proposals/add/{id}(id=${gathering.get().getId()})}"
                               th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}"><i
                                    class="fas fa-handshake ml-2"></i> <span
                                    th:text="#{menu.newVoteProposal}"></span></a>
                        </div>
                    </td>
                    <td th:if="${gathering.get().getVoteProposals() !=null && !gathering.get().getVoteProposals().isEmpty()}">
                        <ul>
                            <li th:each="voteProposal : ${gathering.get().getVoteProposals()}">
                                <span th:if="${#strings.isEmpty(voteProposal.itemOfAgenda)}"
                                      th:text="#{gathering.participate.optionDetail(${voteProposal.name}, ${voteProposal.options.size()})}"></span>
                                <span th:text="#{gathering.participate.optionDetail(${voteProposal.itemOfAgenda + ': ' + voteProposal.name}, ${voteProposal.options.size()})}"></span>
                            </li>
                        </ul>
                    </td>
                    <td th:text="${#dates.format(gathering.get().startedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td th:text="${gathering.get().startedBy?.getUserName()}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:replace="~{fragments/loadJs :: script}"></script>
</body>
</html>
