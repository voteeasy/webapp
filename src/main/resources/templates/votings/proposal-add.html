<!doctype html>
<html class="notranslate" th:lang="${#locale.language}" translate="no" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <title th:text="#{title.addProposal}"></title>
    <link th:replace="~{fragments/headCss :: link}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>
<div class="container">
    <h1 th:text="#{title.addProposal}"></h1>
    <ul>
        <li><a th:replace="~{fragments/historyBack}"></a></li>
    </ul>

    <div class="container my-5">
        <h3 th:text="#{title.proposal.create(${gatheringName})}"></h3>
        <form action="#" method="post" th:action="@{/votings/proposals/addproposal}" th:object="${proposal}">

            <!--/* in order to find gathering to attend to */-->
            <input name="gatheringId" th:value="${gatheringId}" type="hidden"/>
            <input name="gatheringName" th:value="${gatheringName}" type="hidden"/>

            <!--/* base data */-->
            <div class="card">
                <div class="card-body">
                    <div class="col-md-10">
                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="itemofagenda"
                                       th:text="#{headers.itemofagenda}"></label>
                                <input
                                        class="form-control" id="itemofagenda" th:field="*{itemOfAgenda}"
                                        th:placeholder="#{proposal.create.agendaexample}"
                                        type="text">
                                <span
                                        class="text-danger" th:errors="*{itemOfAgenda}"
                                        th:if="${#fields.hasErrors('itemOfAgenda')}"></span>
                                <div class="alert alert-info" role="alert" th:text="#{proposal.create.nocolon}"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="name" th:text="#{proposal.create.name}"></label>
                                <input
                                        class="form-control" id="name" th:field="*{name}"
                                        th:placeholder="#{proposal.create.name}"
                                        type="text">
                                <span
                                        class="text-danger" th:errors="*{name}"
                                        th:if="${#fields.hasErrors('name')}"></span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="isAnonymized"
                                       th:text="#{proposal.create.anonymized}"></label>
                                <input class="form-control" id="isAnonymized" th:field="*{anonymized}"
                                       type="checkbox"/>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="isAdminAllowedToVote"
                                       th:text="#{proposal.create.adminvote}"></label>
                                <input class="form-control" id="isAdminAllowedToVote" th:field="*{adminAllowedToVote}"
                                       type="checkbox"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--/* add options dynamically -
            https://github.com/eugenp/tutorials/tree/master/spring-web-modules/spring-mvc-forms-thymeleaf
            TODO: https://www.thymeleaf.org/doc/tutorials/3.0/thymeleafspring.html#dynamic-fields
            maybe we need to do indexes here? https://justinrodenbostel.com/tag/thymeleaf/
            */-->
            <div class="card">
                <div class="card-body">
                    <div class="col-md-10">
                        <div class="row">
                            <div class="form-group col-md-8">
                                <div class="alert alert-info" role="alert" th:text="#{proposal.create.sorting}"></div>
                            </div>
                        </div>
                        <!--/* manually add 10 option boxes */-->
                        <div class="row" th:each="number : ${#numbers.sequence( 0, 9, 1)}">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" th:for="${'options['+number+']'}"
                                       th:text="#{proposal.create.optionHeader}"></label>
                                <input
                                        class="form-control" th:attr="name='options[' + ${number} + ']'"
                                        th:id="${'options['+number+']'}"
                                        th:placeholder="#{proposal.create.optionPlaceholder}"
                                        type="text">
                                <span class="text-danger" th:each="e : ${#fields.globalErrors()}"
                                      th:if="${#fields.hasGlobalErrors()}" th:text="${e}">
            </span>
                                <span
                                        class="text-danger" th:errors="*{options[0]}"
                                        th:if="${#fields.hasErrors('options[0]')}"></span>
                            </div>
                        </div>

                        <!--/* dynamic addition not working properly
                                            <div class="row">
                                                <div id="addOptionWrapper" class="form-group col-md-8">
                                                    <label for="options" class="col-form-label">Options</label>
                                                </div>
                                                <div class="form-group col-md-12">
                                                    <input id="addOptionButton" type="button" value="Weitere Option eintragen"
                                                           class="form-control col-md-4"/>
                                                </div>

                                                <div class="col-md-6">
                                                    <input class="btn btn-primary" type="submit" th:value="#{proposal.create.save}">
                                                    <input class="btn btn-danger" th:value="#{menu.resetForm}" type="reset"/>
                                                </div>

                                                <div class="form-group col-md-8"></div>
                                            </div>
                                            */-->
                        <div class="row">
                            <div class="col-md-8 pt-1">
                                <input class="btn btn-primary ml-2" th:value="#{proposal.create.save}"
                                       type="submit">
                                <input class="btn btn-danger ml-2" th:value="#{menu.resetForm}" type="reset"/>
                            </div>

                            <div class="form-group col-md-8"></div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:replace="~{fragments/loadJs :: script}"></script>
<script src="/js/voteProposalOptions.js" type="text/javascript"></script>
</body>
</html>
