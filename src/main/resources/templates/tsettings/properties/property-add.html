<!doctype html>
<html class="notranslate" th:lang="${#locale.language}" translate="no" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <title th:text="#{title.addProperty}"></title>
    <link th:replace="~{fragments/headCss :: link}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>
<div class="container">
    <h1 th:text="#{title.addProperty}"></h1>
    <ul>
        <li><a th:replace="~{fragments/historyBack}"></a></li>
    </ul>
    <div class="my-5">
        <h3 th:text="#{title.property.create(${setting.tenantName})}"></h3>
        <form action="#" method="post" th:action="@{'/tsettings/properties/add/'+${setting.tenantId}}"
              th:object="${setting}">
            <!--/* in order to find tenant to attend to */-->
            <input name="tenantId" th:value="${setting.tenantId}" type="hidden"/>
            <input name="tenantName" th:value="${setting.tenantName}" type="hidden"/>
            <!--/** user is wired in from fragment */-->
            <input name="userId" th:value="${user?.id}" type="hidden"/>
            <span class="text-danger" th:each="e : ${#fields.globalErrors()}"
                  th:if="${#fields.hasGlobalErrors()}" th:text="#{${e}}">
            </span>

            <!--/* base data */-->
            <div class="card">
                <div class="card-body">
                    <div class="col-md-10">
                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="key"
                                       th:text="#{headers.key}"></label>
                                <input
                                        class="form-control" id="key" th:field="*{key}"
                                        th:placeholder="#{property.create.key}"
                                        type="text">
                                <span
                                        class="text-danger" th:errors="*{key}"
                                        th:if="${#fields.hasErrors('key')}"></span>
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="value"
                                       th:text="#{headers.value}"></label>
                                <input
                                        class="form-control" id="value" th:field="*{value}"
                                        th:placeholder="#{property.create.value}"
                                        type="text">
                                <span
                                        class="text-danger" th:errors="*{value}"
                                        th:if="${#fields.hasErrors('value')}"></span>
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="type"
                                       th:text="#{headers.type}"></label>
                                <select class="form-control" id="type" th:field="*{type}">
                                    <option th:each="settingType : ${T(de.voteeasy.settings.tenant.SettingType).values()}"
                                            th:text="#{'property.type.'+ ${settingType}}"
                                            th:value="${settingType}"></option>
                                </select>
                                <span
                                        class="text-danger" th:errors="*{type}"
                                        th:if="${#fields.hasErrors('type')}"></span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-md-8">
                                <label class="col-form-label" for="scope"
                                       th:text="#{headers.scope}"></label>
                                <select class="form-control" id="scope" th:field="*{scope}">
                                    <option th:each="settingScope : ${T(de.voteeasy.settings.tenant.SettingScope).values()}"
                                            th:text="#{'property.scope.'+ ${settingScope}}"
                                            th:value="${settingScope}"></option>
                                </select>
                                <span
                                        class="text-danger" th:errors="*{scope}"
                                        th:if="${#fields.hasErrors('scope')}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-8 pt-1">
                            <input class="btn btn-primary ml-2" th:value="#{property.create.save}"
                                   type="submit">
                            <input class="btn btn-danger ml-2" th:value="#{menu.resetForm}" type="reset"/>
                        </div>

                        <div class="form-group col-md-8"></div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:replace="~{fragments/loadJs :: script}"></script>
<script src="/js/voteProposalOptions.js" type="text/javascript"></script>
</body>
</html>
