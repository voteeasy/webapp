# i18n
# Comma-separated list of basenames
spring.messages.basename=voteeasy
#  ,config.i18n.messages
# Whether to always apply the MessageFormat rules, parsing even messages without arguments.
spring.messages.always-use-message-format=false
# Loaded resource bundle files cache duration.
# When not set, bundles are cached forever.
# If a duration suffix is not specified, seconds will be used.
spring.messages.cache-duration=
# Message bundles encoding.
spring.messages.encoding=UTF-8
# Whether to fall back to the system Locale
# if no files for a specific Locale have been found.
spring.messages.fallback-to-system-locale=true
# Whether to use the message code as the default message instead of throwing a "NoSuchMessageException".
# Recommended during development only.
spring.messages.use-code-as-default-message=false
# Enabled for dev mode ONLY
# Templates reloading during development
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
# Static resources reloading during development
spring.web.resources.static-locations=file:src/main/resources/static/
spring.web.resources.cache.period=0
# Individual error handling
server.error.whitelabel.enabled=false
# If you want to see more:
#logging.level.web=DEBUG
# In order to see authentication logs .... if you want to know why stuff yields 40x
#logging.level.org.springframework.security=DEBUG
# DB
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# https://stackoverflow.com/questions/40088915/using-spring-boot-profiles-with-liquibase-changeset-context-attribute-to-manage
spring.liquibase.contexts=test
spring.liquibase.enabled=true
# set to none later!
spring.jpa.hibernate.ddl-auto=validate

# do not overwrite with dynamic/in-memory db
spring.test.database.replace=none

# Do not override datasource as this results in 2 datasources being used: one for liquibase, other one for springboot
#spring.liquibase.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS public
#spring.liquibase.user=sa
#spring.liquibase.password=
spring.liquibase.default-schema=public
spring.jpa.properties.hibernate.default_schema=public

logging.level.liquibase=INFO
# Log extensively:
# logging.level.org.springframework=DEBUG
# SQL data access logs
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type=TRACE

# Avoid java.lang.ClassCastException: class java.lang.String cannot be cast to class ApplicationUser (java.lang.String is in module java.base of loader 'bootstrap'; ApplicationUser is in unnamed module of loader org.springframework.boot.devtools.restart.classloader.RestartClassLoader @4cb2899a)
#spring.devtools.restart.enabled = false

# Show SQL in order to generate Liquibase changesets
#spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
