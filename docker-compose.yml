# local cleanup docker ps -a -q -f status=exited | xargs docker rm
# Build and start the webapp and database: docker compose up --build -d
# Start only the database for a local Maven run: docker compose up -d postgres
# Database shell: docker compose exec postgres bash
# 3. $ docker volume ls/rm to really delete existing data
services:
  postgres:
    image: postgres:14.3
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U postgres -d voteeasy" ]
      timeout: 45s
      interval: 10s
      retries: 10
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: voteeasy
      POSTGRES_HOST_AUTH_METHOD: password
    volumes:
      - postgres:/var/lib/postgresql/data

  webapp:
    build:
      context: .
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/voteeasy
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Packaged resources instead of the local source-tree paths.
      SPRING_THYMELEAF_PREFIX: classpath:/templates/
      SPRING_THYMELEAF_CACHE: "true"
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: classpath:/static/

volumes:
  postgres:
